name: AOT integration tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  aot_artifacts:
    uses: ./.github/workflows/build_aot_artifacts.yml

  aot_stdio_linux:
    needs: aot_artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          libc: gnu
          arch: x86_64
        - runner: ubuntu-24.04-arm
          libc: gnu
          arch: aarch64
        - runner: ubuntu-24.04
          libc: musl
          arch: x86_64
        - runner: ubuntu-24.04-arm
          libc: musl
          arch: aarch64

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/wasmtime external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - uses: actions/download-artifact@v8
      with:
        name: AOT-Artifacts
        path: .

    - uses: Swatinem/rust-cache@v2
      if: matrix.libc == 'gnu'
      with:
        shared-key: ${{ matrix.runner }}-aot-test

    - name: Install Rust toolchains
      run: |
        rustup target add wasm32-wasip2

    - name: Install Xvfb
      run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 xvfb

    - name: Run native glibc AOT test
      if: matrix.libc == 'gnu'
      run: |
        test "$(uname -m)" = "${{ matrix.arch }}"
        xvfb-run -a cargo test --locked --no-default-features --features compile,llvm --test aot_stdio

    - name: Run native musl AOT test
      if: matrix.libc == 'musl'
      run: |
        Xvfb :99 -screen 0 1024x768x24 -ac &
        xvfb_pid=$!
        trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
        for attempt in $(seq 1 50); do
          test -S /tmp/.X11-unix/X99 && break
          sleep 0.1
        done

        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --volume /tmp/.X11-unix:/tmp/.X11-unix \
          --workdir /workspace \
          --env DISPLAY=:99 \
          rust:1-alpine3.22 \
          sh -euxc '
            test "$(uname -m)" = "${{ matrix.arch }}"
            apk add --no-cache build-base ca-certificates cmake git libgcc libstdc++ pkgconf zlib \
              libx11 libxrandr libxcursor libxinerama libxi libxfixes libxext libxcb \
              libxkbcommon libxkbcommon-x11 libxscrnsaver
            cargo test --locked --no-default-features --features compile,llvm --test aot_stdio
          '

  aot_stdio_android:
    needs: aot_artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/wasmtime external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - uses: actions/download-artifact@v8
      with:
        name: AOT-Artifacts
        path: .

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ubuntu-24.04-android-aot-test

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21

    - uses: android-actions/setup-android@v4
      with:
        packages: platform-tools emulator

    - name: Install Rust toolchains
      run: |
        rustup target add wasm32-wasip2

    - name: Install Android SDK platform
      run: |
        sdkmanager "platforms;android-36"

    - name: Install Linux runtime dependencies
      run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0

    - name: Build Android AOT test binary
      run: cargo test --locked --no-default-features --features compile,llvm --test aot_android --no-run

    - name: Enable KVM group perms
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Android AOT stdio test in x86_64 emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 36
        target: google_apis
        arch: x86_64
        disable-animations: false
        script: cargo test --locked --no-default-features --features compile,llvm --test aot_android -- --nocapture

  aot_stdio_windows:
    needs: aot_artifacts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: windows-2025
          arch: x86_64
          vs_arch: amd64
        - runner: windows-11-arm
          arch: aarch64
          vs_arch: arm64

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/wasmtime external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - uses: actions/download-artifact@v8
      with:
        name: AOT-Artifacts
        path: .

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ matrix.runner }}-aot-test

    - name: Install Rust toolchains
      run: |
        rustup target add wasm32-wasip2
        rustup target add ${{ matrix.arch }}-pc-windows-msvc

    - name: Run native Windows AOT test
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
          call "%%i" -arch=${{ matrix.vs_arch }}
        )
        set CC=clang-cl
        set CXX=clang-cl
        cargo test --locked --no-default-features --features compile,llvm --target=${{ matrix.arch }}-pc-windows-msvc --test aot_stdio || exit /b 1

  aot_stdio_macos_ios:
    needs: aot_artifacts
    runs-on: macos-26
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/wasmtime external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - uses: actions/download-artifact@v8
      with:
        name: AOT-Artifacts-macOS
        path: .

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: macos-26-aot-test

    - name: Install Rust toolchains
      run: |
        rustup target add wasm32-wasip2

    - name: Run native macOS AOT test
      run: |
        cargo test --locked --no-default-features --features compile,llvm --test aot_stdio

    - name: Run iOS Simulator AOT stdio test
      run: |
        cargo test --locked --no-default-features --features compile,llvm --test aot_ios -- --nocapture
