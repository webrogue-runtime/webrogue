name: Webrogue CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_call:

env:
  # CI does not need debuginfo. It dominates target/ size and cache upload time.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # check - components for scripts/cargo_check.py ("" disables)
  # tasks - list of: fmt, clippy, unit_tests, runtime_tests
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: ""
            check: ""
            tasks: [fmt, clippy, unit_tests, runtime_tests]
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: ""
            check: "cli,aot-lib"
            tasks: [runtime_tests]
          - name: windows-aarch64
            os: windows-11-arm
            target: "aarch64-pc-windows-msvc"
            check: "cli,aot-lib"
            tasks: [runtime_tests]
          - name: windows-x86_64
            os: windows-2025
            target: "x86_64-pc-windows-msvc"
            check: ""
            tasks: [runtime_tests]
          - name: macos-aarch64
            os: macos-26
            target: "aarch64-apple-darwin"
            check: "cli,aot-lib"
            tasks: [runtime_tests]
          - name: macos-ios
            os: macos-26
            target: ""
            check: "ios,macos"
            tasks: []
          - name: android
            os: ubuntu-24.04
            target: ""
            check: "android"
            tasks: []

    steps:
      - uses: actions/checkout@v7

      - name: Submodules
        run: |
          git submodule update --init --single-branch --depth=1 external/virglrenderer external/wasmtime external/zstd-rs
          git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

      - name: Submodules (SDK)
        if: matrix.check != ''
        run: |
          git submodule update --init --single-branch --depth=1 webrogue-sdk

      - uses: taiki-e/install-action@v2.87.29
        if: contains(matrix.check, 'android')
        with:
          tool: cargo-ndk

      - name: Install Rust toolchains (common)
        run: |
          rustup target add wasm32-wasip2

      - name: Install Rust toolchains (target)
        if: matrix.target != ''
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install Rust toolchains (Android)
        if: contains(matrix.check, 'android')
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Install Rust toolchains (iOS)
        if: contains(matrix.check, 'ios')
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      # Caches are written only from pushes to main; PRs and the merge queue
      # restore them. Keys are intentionally stable (no lock hash), so refresh
      # an entry by deleting it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.name }}
          add-rust-environment-hash-key: false
          cache-all-crates: true
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set macOS deployment target
        if: startsWith(matrix.os, 'macos')
        run: echo MACOSX_DEPLOYMENT_TARGET=12.0 >> "$GITHUB_ENV"

      - name: Check Rust formatting
        if: contains(matrix.tasks, 'fmt')
        run: python3 scripts/cargo_fmt_check.py

      - name: Run cargo clippy (Unix)
        if: contains(matrix.tasks, 'clippy') && startsWith(matrix.os, 'windows') == false
        run: |
          cargo clippy --locked ${{ matrix.target && format('--target={0}', matrix.target) || '' }} --workspace --all-targets \
            --exclude webrogue-web-runtime \
            --exclude webrogue-launcher \
            --exclude webrogue-launcher-dev \
            --exclude webrogue-launcher-server-openapi \
            --exclude webrogue-android-launcher \
            -- -D warnings

      - name: Run cargo clippy (Windows)
        if: contains(matrix.tasks, 'clippy') && startsWith(matrix.os, 'windows')
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
            call "%%i"
          )
          set CC=clang-cl
          set CXX=clang-cl
          cargo clippy --locked ${{ matrix.target && format('--target={0}', matrix.target) || '' }} --workspace --all-targets ^
            --exclude webrogue-web-runtime ^
            --exclude webrogue-launcher ^
            --exclude webrogue-launcher-dev ^
            --exclude webrogue-launcher-server-openapi ^
            --exclude webrogue-android-launcher ^
            -- -D warnings || exit /b 1

      - name: Run check scripts (on UNIX)
        if: matrix.check != '' && startsWith(matrix.os, 'windows') == false
        run: |
          COMPONENTS=${{ matrix.check }} python3 scripts/cargo_check.py

      - name: Run check scripts (on Windows)
        if: matrix.check != '' && startsWith(matrix.os, 'windows') == true
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
            call "%%i"
          )
          REM gfxstream doesn't seem to support MSVC
          set CXX=clang-cl
          set CC=clang-cl
          set COMPONENTS=${{ matrix.check }}
          python3 scripts\cargo_check.py || exit /b 1

      - name: Build CLI for wasm-opt tests (Unix)
        if: contains(matrix.tasks, 'unit_tests') && startsWith(matrix.os, 'windows') == false
        run: |
          cargo build --locked ${{ matrix.target && format('--target={0}', matrix.target) || '' }} --bin webrogue
          target="${{ matrix.target }}"
          if [ -n "$target" ]; then
            echo "WEBROGUE_WASM_OPT_BIN=${{ github.workspace }}/target/$target/debug/webrogue" >> "$GITHUB_ENV"
          else
            echo "WEBROGUE_WASM_OPT_BIN=${{ github.workspace }}/target/debug/webrogue" >> "$GITHUB_ENV"
          fi

      - name: Build CLI for wasm-opt tests (Windows)
        if: contains(matrix.tasks, 'unit_tests') && startsWith(matrix.os, 'windows')
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
            call "%%i"
          )
          set CC=clang-cl
          set CXX=clang-cl
          set CXXFLAGS=/EHsc
          cargo build --locked ${{ matrix.target && format('--target={0}', matrix.target) || '' }} --bin webrogue || exit /b 1
          set "TARGET=${{ matrix.target }}"
          if "%TARGET%"=="" (
            echo WEBROGUE_WASM_OPT_BIN=%GITHUB_WORKSPACE%\target\debug\webrogue.exe>> "%GITHUB_ENV%"
          ) else (
            echo WEBROGUE_WASM_OPT_BIN=%GITHUB_WORKSPACE%\target\%TARGET%\debug\webrogue.exe>> "%GITHUB_ENV%"
          )

      - name: Run unit tests (Unix)
        if: contains(matrix.tasks, 'unit_tests') && startsWith(matrix.os, 'windows') == false
        run: |
          cargo test --locked ${{ matrix.target && format('--target={0}', matrix.target) || '' }} --workspace --lib --bins \
            --exclude webrogue-web-runtime \
            --exclude webrogue-launcher \
            --exclude webrogue-launcher-dev \
            --exclude webrogue-android-launcher

      - name: Run unit tests (Windows)
        if: contains(matrix.tasks, 'unit_tests') && startsWith(matrix.os, 'windows')
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
            call "%%i"
          )
          set CC=clang-cl
          set CXX=clang-cl
          set CXXFLAGS=/EHsc
          cargo test --locked ${{ matrix.target && format('--target={0}', matrix.target) || '' }} --workspace --lib --bins ^
            --exclude webrogue-web-runtime ^
            --exclude webrogue-launcher ^
            --exclude webrogue-launcher-dev ^
            --exclude webrogue-android-launcher || exit /b 1

      - name: Run runtime integration tests (Unix)
        if: contains(matrix.tasks, 'runtime_tests') && startsWith(matrix.os, 'windows') == false
        run: |
          cargo test --locked --no-default-features --features internal-run \
            ${{ matrix.target && format('--target={0}', matrix.target) || '' }} \
            --test runtime

      - name: Run runtime integration tests (Windows)
        if: contains(matrix.tasks, 'runtime_tests') && startsWith(matrix.os, 'windows')
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
            call "%%i"
          )
          set CC=clang-cl
          set CXX=clang-cl
          cargo test --locked --no-default-features --features internal-run ${{ matrix.target && format('--target={0}', matrix.target) || '' }} --test runtime || exit /b 1

  typos:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2.87.29
        with:
          tool: typos@1.51.1

      - name: Run typos-cli
        run: typos

  # Additional checks
  # build_cli:
  #   needs: [ checks, typos ]
  #   uses: ./.github/workflows/build_cli.yml
