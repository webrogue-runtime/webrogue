name: Webrogue CI

on: 
  pull_request:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04-arm
          components: cli,aot-lib
        - os: windows-11-arm
          components: cli,aot-lib
        - os: macos-26
          components: cli,aot-lib
        - os: macos-26
          components: ios,macos
        - os: ubuntu-24.04 # There is no NDK build for AArch64 Linux. Shame on you, Google.
          components: android

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/virglrenderer external/zstd-rs webrogue-sdk
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - uses: taiki-e/install-action@v2.87.29
      if: contains(matrix.components, 'android')
      with:
        tool: cargo-ndk

    - name: Install Rust toolchains (macOS)
      if: startsWith(matrix.os, 'macos') == true && contains(matrix.components, 'cli') == true
      run: |
        rustup target add aarch64-apple-darwin
        # rustup target add x86_64-apple-darwin

    - name: Install Rust toolchains (Windows)
      if: startsWith(matrix.os, 'windows') == true && contains(matrix.components, 'cli') == true
      run: |
        rustup target add x86_64-pc-windows-msvc

    - name: Install Rust toolchains (Android)
      if: contains(matrix.components, 'android') == true
      run: |
        rustup target add aarch64-linux-android
        rustup target add x86_64-linux-android
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

    - name: Install Rust toolchains (iOS)
      if: contains(matrix.components, 'ios') == true
      run: |
        rustup target add aarch64-apple-ios
        rustup target add aarch64-apple-ios-sim
        rustup target add x86_64-apple-ios

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ matrix.os }}-${{ strategy.job-index }}

    - name: Run check scripts (on UNIX)
      if: startsWith(matrix.os, 'windows') == false
      run: |
        COMPONENTS=${{ matrix.components }} python3 scripts/cargo_check.py

    - name: Run check scripts (on Windows)
      if: startsWith(matrix.os, 'windows') == true
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
          call "%%i"
        )
        REM gfxstream doesn't seem to support MSVC
        set CXX=clang-cl
        set CC=clang-cl
        set COMPONENTS=${{ matrix.components }}
        python3 scripts\cargo_check.py || exit /b 1

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ubuntu-unit-tests

    - name: Check Rust formatting
      run: python3 scripts/cargo_fmt_check.py

    - name: Run unit tests
      run: cargo test --locked --package webrogue-common --package webrogue-icons

  runtime-integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          arch: x86_64
        - os: ubuntu-24.04-arm
          arch: aarch64
        - os: windows-2025
          arch: x86_64
        - os: windows-11-arm
          arch: aarch64
        - os: macos-26
          arch: aarch64

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/virglrenderer external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ matrix.os }}-runtime-integration

    - name: Install Windows Rust target
      if: startsWith(matrix.os, 'windows')
      run: rustup target add ${{ matrix.arch }}-pc-windows-msvc

    - name: Set macOS deployment target
      if: matrix.os == 'macos-26'
      run: echo MACOSX_DEPLOYMENT_TARGET=12.0 >> "$GITHUB_ENV"

    - name: Run runtime integration tests (Unix)
      if: startsWith(matrix.os, 'windows') == false
      run: cargo test --locked --no-default-features --features internal-run --test runtime

    - name: Run runtime integration tests (Windows)
      if: startsWith(matrix.os, 'windows')
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
          call "%%i"
        )
        set CC=clang-cl
        set CXX=clang-cl
        cargo test --locked --no-default-features --features internal-run --target=${{ matrix.arch }}-pc-windows-msvc --test runtime || exit /b 1

  typos:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: taiki-e/install-action@v2.87.29
      with:
        tool: typos@1.51.1

    - name: Run typos-cli
      run: typos

  # Additional checks
  # build_cli:
  #   needs: [ platform-checks, unit-tests, typos ]
  #   uses: ./.github/workflows/build_cli.yml
