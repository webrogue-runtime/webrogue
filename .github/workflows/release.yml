name: Release Webrogue CLI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
  schedule:
    - cron: "37 13 * * 0"

jobs:
  build:
    uses: ./.github/workflows/build_cli.yml

  aot_integration:
    uses: ./.github/workflows/aot_integration.yml

  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [build, aot_integration, ci]
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: AOT-Artifacts-Packed
          path: aot_artifacts_packed

      - uses: actions/download-artifact@v8
        with:
          name: CLI-linux-x86_64-glibc-raw
          path: webrogue-cli-linux-glibc-x86_64

      - uses: actions/download-artifact@v8
        with:
          name: CLI-linux-aarch64-glibc-raw
          path: webrogue-cli-linux-glibc-aarch64

      - uses: actions/download-artifact@v8
        with:
          name: CLI-linux-x86_64-musl-raw
          path: webrogue-cli-linux-musl-x86_64

      - uses: actions/download-artifact@v8
        with:
          name: CLI-linux-aarch64-musl-raw
          path: webrogue-cli-linux-musl-aarch64

      - uses: actions/download-artifact@v8
        with:
          name: CLI-macOS-arm64-raw
          path: webrogue-cli-macos-arm64

      - uses: actions/download-artifact@v8
        with:
          name: CLI-macOS-x86_64-raw
          path: webrogue-cli-macos-x86_64

      - uses: actions/download-artifact@v8
        with:
          name: CLI-windows-x86_64-raw
          path: webrogue-cli-windows-x86_64/webrogue.exe

      - uses: actions/download-artifact@v8
        with:
          name: CLI-windows-aarch64-raw
          path: webrogue-cli-windows-aarch64/webrogue.exe

      - name: Append artifacts
        run: |
          for dir in webrogue-cli-linux-glibc-x86_64 webrogue-cli-linux-glibc-aarch64 webrogue-cli-linux-musl-x86_64 webrogue-cli-linux-musl-aarch64 webrogue-cli-macos-arm64 webrogue-cli-macos-x86_64
          do
            chmod +x $dir/webrogue
            tar czf $dir.tar.gz $dir/
          done

          zip -r webrogue-cli-windows-x86_64.zip webrogue-cli-windows-x86_64/
          zip -r webrogue-cli-windows-aarch64.zip webrogue-cli-windows-aarch64/

      - uses: ncipollo/release-action@v1
        if: github.event_name == 'push'
        with:
          artifacts: |
            webrogue-cli-linux-glibc-x86_64.tar.gz
            webrogue-cli-linux-glibc-aarch64.tar.gz
            webrogue-cli-linux-musl-x86_64.tar.gz
            webrogue-cli-linux-musl-aarch64.tar.gz
            webrogue-cli-macos-arm64.tar.gz
            webrogue-cli-macos-x86_64.tar.gz
            webrogue-cli-windows-x86_64.zip
            webrogue-cli-windows-aarch64.zip
            aot_artifacts_packed/*.zip
          name: Release ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          makeLatest: true
