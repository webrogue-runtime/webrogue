name:  Build Webrogue CLI utility

on:
  workflow_call:

jobs:
  linux-cli:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
          artifact: CLI-linux-x86_64-glibc-raw
          libc: gnu
        - arch: aarch64
          runner: ubuntu-24.04-arm
          artifact: CLI-linux-aarch64-glibc-raw
          libc: gnu
        - arch: x86_64
          runner: ubuntu-24.04
          artifact: CLI-linux-x86_64-musl-raw
          libc: musl
        - arch: aarch64
          runner: ubuntu-24.04-arm
          artifact: CLI-linux-aarch64-musl-raw
          libc: musl

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/virglrenderer external/wasmtime external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - name: Build
      run: |
        COMPONENTS=cli LIBCS=${{ matrix.libc }} sh linux/build.sh

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        retention-days: 1
        if-no-files-found: error
        path: linux/${{ matrix.libc }}/${{ matrix.arch }}/target/${{ matrix.arch }}-unknown-linux-${{ matrix.libc }}/cli/webrogue

  macos-arm64-cli:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/virglrenderer external/wasmtime external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - name: Setup Rust
      run: |
        rustup target add aarch64-apple-darwin
  
    - name: Build
      run: |
        export MACOSX_DEPLOYMENT_TARGET=12.0
        cargo build --no-default-features --profile=cli --target=aarch64-apple-darwin --features=full

    - uses: actions/upload-artifact@v7
      with:
        name: CLI-macOS-arm64-raw
        retention-days: 1
        if-no-files-found: error
        path: target/aarch64-apple-darwin/cli/webrogue

  macos-x86_64-cli:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/virglrenderer external/wasmtime external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - name: Setup Rust
      run: |
        rustup target add x86_64-apple-darwin
  
    - name: Build
      run: |
        export MACOSX_DEPLOYMENT_TARGET=12.0
        cargo build --no-default-features --profile=cli --target=x86_64-apple-darwin --features=full

    - uses: actions/upload-artifact@v7
      with:
        name: CLI-macOS-x86_64-raw
        retention-days: 1
        if-no-files-found: error
        path: target/x86_64-apple-darwin/cli/webrogue

  windows-cli:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
        - runner: windows-11-arm
          arch: x86_64
          artifact: CLI-windows-x86_64-raw
        - runner: windows-11-arm
          arch: aarch64
          artifact: CLI-windows-aarch64-raw

    steps:
    - uses: actions/checkout@v7

    - name: Submodules
      run: |
        git submodule update --init --single-branch --depth=1 external/virglrenderer external/wasmtime external/zstd-rs
        git -C external/zstd-rs/ submodule update --init zstd-safe/zstd-sys/zstd

    - name: Install Rust target
      run: |
        rustup target add ${{ matrix.arch }}-pc-windows-msvc

    - name: Build
      shell: cmd 
      run: |
        for /f "usebackq tokens=*" %%i in (`vswhere -latest -find Common7\Tools\VsDevCmd.bat`) do (
          call "%%i"
        )
        REM gfxstream doesn't seem to support MSVC
        set CC=clang-cl
        set CXX=clang-cl
        set CXXFLAGS=/EHsc
        cargo build --no-default-features --target=${{ matrix.arch }}-pc-windows-msvc --features=full --profile cli  || exit /b 1

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        retention-days: 1
        if-no-files-found: error
        path: target/${{ matrix.arch }}-pc-windows-msvc/cli/webrogue.exe
