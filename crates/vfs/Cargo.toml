[package]
name = "webrogue-vfs"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
wasmtime = ["dep:wasmtime", "dep:tokio"]
archive = ["webrogue-wrapp/write", "image-codecs"]
image-codecs = ["image/png"]

[dependencies]
anyhow = { workspace = true }
webrogue-wrapp = { workspace = true }
webrogue-common = { workspace = true }
serde = { workspace = true, features = ["derive"] }
schemars = { workspace = true, features = ["semver1"] }
serde_json = { workspace = true }
semver = { workspace = true, default-features = false, features = ["serde"] }
image = { workspace = true, default-features = false, features = ["bmp"] }

wasmtime = { workspace = true, optional = true, default-features = false, features = ["component-model-async"] }
tokio = { workspace = true, optional = true, features = ["sync"] }
