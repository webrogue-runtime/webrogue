[package]
name = "webrogue-debugger"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
wasmtime-internal-debugger = { workspace = true }
wasmtime-internal-gdbstub-component-artifact = { workspace = true }
wasmtime = { workspace = true, default-features = false, features = ["anyhow", "cranelift", "component-model"] }
wasmtime-wasi = { workspace = true, default-features = false, features = ["p2"] } # wasmtime-internal-debugger needs p2, but is too shy to ask
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
async-trait = { workspace = true }

[dev-dependencies]
wasmtime = { workspace = true, default-features = false, features = ["wat"] }
