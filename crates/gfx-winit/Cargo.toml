[package]
name = "webrogue-gfx-winit"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["wasmtime"]
wasmtime = ["webrogue-gfx/wasmtime"]
web = ["webrogue-gfx/web"]

[dependencies]
anyhow = { workspace = true }
webrogue-gfx = { workspace = true }
winit = { workspace = true, default-features = true }
softbuffer = { workspace = true, default-features = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
image = { workspace = true, default-features = false, features = ["bmp"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = { workspace = true, features = ["std", "loaded"], default-features = false }
ash-window = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["Element", "HtmlCanvasElement"] }
winit-web = { workspace = true }
