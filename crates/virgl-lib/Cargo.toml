[package]
name = "webrogue-virgl-lib"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[lib]
crate-type=["lib"]

[features]
_build = ["dep:cc", "dep:bindgen"]
impl = ["_build"]
stub = ["_build"]

[build-dependencies]
cc = { workspace = true, optional = true }

[target.'cfg(target_env = "musl")'.build-dependencies]
bindgen = { workspace = true, optional = true, default-features = false }

[target.'cfg(not(target_env = "musl"))'.build-dependencies]
bindgen = { workspace = true, optional = true, default-features = true }
