[package]
name = "webrogue-aot-compiler"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
default = []
llvm = []
appended_artifacts = ["dep:webrogue-common"]

[dependencies]
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
webrogue-common = { workspace = true, optional = true }
webrogue-icons = { workspace = true, features = ['rayon'] }
wasmtime = { workspace = true, default-features = false, features = ["cranelift", "all-arch", "component-model-async", "parallel-compilation", "cache", "anyhow", "gc-drc"] }
webrogue-vfs = { workspace = true, features = ["archive"] }
webrogue-wrapp = { workspace = true }
object = { workspace = true, default-features = false, features = ['read_core', 'write_core', 'elf', 'macho', 'coff'] }
wasmtime-environ = { workspace = true, default-features = false }
postcard = { workspace = true, default-features = false, features = ['alloc'] }
serde = { workspace = true, features = ['derive'] }
zip = { workspace = true, default-features = false, features = ['deflate'] }
webrogue-cli-goodies = { workspace = true }
tempfile = { workspace = true }
semver = { workspace = true, default-features = false }
