# Linking static LLVM libraries with Linux's LD or Windows' Link is pain

[target.x86_64-unknown-linux-gnu]
rustflags = [
    # "-C", "link-arg=-fuse-ld=lld",
]
[target.x86_64-pc-windows-msvc]
# Enable static CTR on Windows
rustflags = [
    "-C", "target-feature=+crt-static"
]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
# Enable static CTR on Windows
rustflags = [
    "-C", "target-feature=+crt-static"
]
linker = "rust-lld.exe"

[target.x86_64-unknown-linux-musl]
# Disable static CTR on musl Linux since we will need to dlopen graphics drivers and other shared libraries
rustflags = [
    "-C", "target-feature=-crt-static"
]

[target.aarch64-unknown-linux-musl]
# Disable static CTR on musl Linux since we will need to dlopen graphics drivers and other shared libraries
rustflags = [
    "-C", "target-feature=-crt-static"
]

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--export-memory",
    "-C", "link-arg=--export-if-defined=__wasm_init_tls",
    "-C", "link-arg=--export-if-defined=__tls_size",
    "-C", "link-arg=--export-if-defined=__tls_align",
    "-C", "link-arg=--export-if-defined=__tls_base",
    "-C", "link-arg=--max-memory=4294967296",
    "-Z", "wasm-c-abi=spec"
]

[unstable]
build-std = ["std,panic_abort"]
