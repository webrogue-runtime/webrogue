# Linking static LLVM libraries with Linux's LD or Windows' Link is pain

[target.x86_64-unknown-linux-gnu]
rustflags = [
    # "-C", "link-arg=-fuse-ld=lld",
]
[target.x86_64-pc-windows-msvc]
# Enable static CTR on Windows
rustflags = [
    "-C", "target-feature=+crt-static"
]
linker = "rust-lld.exe"

[target.aarch64-pc-windows-msvc]
# Enable static CTR on Windows
rustflags = [
    "-C", "target-feature=+crt-static"
]
linker = "rust-lld.exe"

[target.x86_64-unknown-linux-musl]
# Disable static CTR on musl Linux since we will need to dlopen graphics drivers and other shared libraries
rustflags = [
    "-C", "target-feature=-crt-static"
]

[target.aarch64-unknown-linux-musl]
# Disable static CTR on musl Linux since we will need to dlopen graphics drivers and other shared libraries
rustflags = [
    "-C", "target-feature=-crt-static"
]
