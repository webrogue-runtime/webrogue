[package]
name = "webrogue-ios"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# default = ["launcher"]
launcher = [
    "webrogue-launcher",
    "dep:winit",
] # TODO use pulley
runner = [
    "dep:webrogue-wasmtime",
    "webrogue-wasmtime/aot",
    "webrogue-wrapp",
    "webrogue-vfs",
    "webrogue-gfx-winit",
]

[lib]
name = "webrogue_ios"
crate-type = ["staticlib"]

[dependencies]
anyhow = { workspace = true }
webrogue-gfx = { workspace = true, features = ["static-vk"] }

# runner features
webrogue-wasmtime = { workspace = true, optional = true }
webrogue-wrapp = { workspace = true, optional = true }
webrogue-vfs = { workspace = true, optional = true }


# launcher features
webrogue-launcher = { workspace = true, optional = true, features = ["winit"] }
winit = { workspace = true, optional = true, default-features = true }
webrogue-gfx-winit = { workspace = true, optional = true }

