<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Webrogue</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding: 1.5rem;
        background: #101014;
        color: #e8e8ed;
        font-family: system-ui, sans-serif;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
      }

      #webrogue-runtime-canvas {
        width: min(100%, 960px);
        aspect-ratio: 4 / 3;
        background: #000;
        border: 1px solid #2c2c34;
        border-radius: 0.5rem;
        image-rendering: pixelated;
      }

      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: center;
      }

      button,
      label.file {
        padding: 0.5rem 0.9rem;
        border: 1px solid #3a3a45;
        border-radius: 0.4rem;
        background: #1c1c23;
        color: inherit;
        cursor: pointer;
        font: inherit;
      }

      button:hover,
      label.file:hover {
        background: #26262f;
      }

      input[type="file"] {
        display: none;
      }

      #status {
        min-height: 1.5em;
        color: #9a9aa8;
        font-size: 0.9rem;
        text-align: center;
      }

      #status.error {
        color: #ff8f8f;
      }
    </style>
  </head>
  <body>
    <h1>Webrogue</h1>

    <canvas id="webrogue-runtime-canvas" width="960" height="720"></canvas>

    <div id="controls">
      <label class="file">
        Open WRAPP…
        <input id="wrapp-file" type="file" accept=".wrapp,application/octet-stream" />
      </label>
      <button id="restart" type="button">Reload app</button>
    </div>

    <p id="status">Loading runtime…</p>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
