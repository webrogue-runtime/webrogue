[package]
name = "webrogue-web-runtime"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Browser runtime for Webrogue"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
console_error_panic_hook = { version = "0.1.7" }
js-sys = "0.3"
parking_lot = { workspace = true, features = ["nightly"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm_thread = { workspace = true, features = ["es_modules"] }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Response",
    "Window",
] }
webrogue-common = { workspace = true }
webrogue-gfx = { workspace = true, default-features = false, features = ["web"] }
webrogue-gfx-winit = { workspace = true, default-features = false, features = ["web"] }
webrogue-vfs = { workspace = true }
webrogue-wasm-processing = { workspace = true }
webrogue-wrapp = { workspace = true }
winit = { workspace = true }
winit-web = { workspace = true }
